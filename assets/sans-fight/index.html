<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sans Fight</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: white;
            background: black;
            touch-action: none;
            user-select: none;
        }
        #c2canvasdiv {
            width: 100%;
            height: 100%;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="640" height="480">
            Your browser does not support HTML5 canvas.
        </canvas>
    </div>
    <script src="jquery-3.4.1.min.js"></script>
    <script src="c2runtime.js"></script>
    <script>
        jQuery(document).ready(function () {
            cr_createRuntime("c2canvas");
        });

        function updateSuspendedState() {
            cr_setSuspended(document.hidden);
        }

        document.addEventListener("visibilitychange", updateSuspendedState, false);
    </script>
</body>
</html>

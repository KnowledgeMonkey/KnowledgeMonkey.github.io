<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dont press the button!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="progress-hud" aria-label="Game progress">
        <div class="progress-row">
            <span id="level-text">LV 01</span>
            <span><strong id="clicks">0</strong> clicks</span>
            <span id="combo-text">x1</span>
            <button id="index-button" type="button">INDEX</button>
        </div>
        <div class="xp-track"><div id="xp-fill"></div></div>
        <div class="progress-details">
            <span id="rank-text">3/21 events</span>
            <span id="next-unlock">next: level 2</span>
        </div>
    </section>

    <button id="button"><span>Press me!</span></button>
    <script src="script.js"></script>
</body>
</html>
